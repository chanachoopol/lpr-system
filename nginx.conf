server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ปิดการแสดงเลขเวอร์ชันของ Nginx เพื่อความปลอดภัย
    server_tokens off;

    # Security Headers ป้องกันการโจมตี
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # เปิดการบีบอัด Gzip เพื่อความรวดเร็วในการส่งข้อมูล
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # แคชไฟล์สแตติกที่มีการใส่ Hash ในชื่อไฟล์ (เช่น .js, .css, รูปภาพ) 1 ปี
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ห้ามเบราว์เซอร์แคช index.html เพื่อให้ผู้ใช้ได้รับโค้ดเวอร์ชันล่าสุดเสมอเมื่อ Deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # รองรับ React Router (SPA) — ถ้าไม่เจอไฟล์ ให้ย้อนกลับไปที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
